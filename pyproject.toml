[project]
name = "contextox"
version = "0.2.0"
description = "A local-first, governed business-definition Workbench for FDEs."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "ContextOx contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[project.scripts]
contextox = "contextox.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextox = ["static/**/*", "demo/*"]

[tool.uv]
package = true
