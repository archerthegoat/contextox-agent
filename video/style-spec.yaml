style_id: contextox-product-film-v3
visual_theme: editorial_handmade_energy_meets_real_workbench
palette:
  paper: "#F5F7FA"
  surface: "#FFFFFF"
  ink: "#13243A"
  muted: "#607086"
  line: "#DCE3EB"
  blue: "#1674F3"
  green: "#147D64"
  amber: "#A76A08"
  red: "#B8493E"
  marker_blue: "#2C7DFF"
  paper_warm: "#F3EFE7"
typography:
  family: system_sans
  chinese_fallbacks:
    - PingFang SC
    - Hiragino Sans GB
  caption_max_lines: 2
  minimum_caption_hold_seconds: 1.5
motion:
  density: high_but_breathing
  rhythm: 100_bpm_exact_18_frame_grid
  stage_moments:
    - paparazzi_number_hits
    - freeze_and_handdraw_rules
    - workbench_cursor_performance
    - confirmation_crash_zoom
    - ui_to_brand_morph
  ui_language:
    - cursor_travel
    - click_feedback
    - typed_goal
    - progressive_messages
    - focused_state_change
    - shot_size_variation
    - stillness_after_impact
  scene_rule: 每个镜头只承担一个主要动作
  readability_rule: 动画完成后必须留出可读静止区，重要字幕至少完整停留 45 帧
  deterministic_rule: 禁止 Math.random、Date.now 和依赖渲染顺序的噪声
  forbidden:
    - slide_deck_replay
    - generic_ai_orb
    - invented_product_control
    - decorative_constant_motion
    - copying_specific_gawx_shots
    - shaking_readable_text
texture:
  paper_grain: deterministic_subtle_overlay
  handdraw: blue_marker_with_slightly_rough_path
  collage: restrained_tape_edges_and_contact_sheet_marks
  actual_ui: no_texture_over_small_text
camera:
  wide: establish_real_workbench
  medium: follow_current_task_area
  close: one_field_one_question_or_one_decision
  max_scale: 1.75
  overshoot_max_percent: 5
workbench_fidelity:
  surfaces:
    - workspace_navigation
    - source_picker
    - agent_conversation
    - clarification_questions
    - answer_confirmation
    - candidate_field
    - candidate_relationship
    - round_changes
  disclosure_always_visible: true
  screenshot_policy: 真实产品截图作为界面纹理；程序化叠加仅用于镜头、鼠标、聚焦和批注，不虚构控件
safe_area_px:
  horizontal: 76
  vertical: 24
audio:
  bpm: 100
  frames_per_beat: 18
  swing_ratio: 0.58
  style: dry_jazz_drums_short_solo_and_muted_bass
  voice: none
  moments:
    - three_opening_hits
    - freeze_brush_fill
    - cursor_clicks
    - confirmation_tom_fill
    - result_bass_answer
    - closing_resolve_and_tail
  third_party_assets: none
  mix:
    integrated_lufs_target: -16
    true_peak_dbtp_max: -1
    music_duck_db_during_dense_ui: -2
inspiration_boundary:
  source: GAWX high-level filmmaking language
  use: fast_and_slow_contrast_handmade_marks_grain_sound_driven_cuts
  do_not_use: copied_frames_assets_music_or_signature_compositions
