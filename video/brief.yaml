  reference: GAWX-inspired editorial energy
  interpretation: 快切与静帧交替、手写批注、景别变化、纸张颗粒和声音驱动剪辑
  originality_boundary: 只借鉴高级表达原则，不复制任何具体作品、镜头或素材
