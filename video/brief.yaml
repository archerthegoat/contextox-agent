primary_message: 同一份订单数据，为什么会有三个答案？
supporting_message: 不是大家不会算，而是没有先说清哪些算进去、退款怎么处理、按哪个时间。数契让 Agent 找出处、提出问题，人确认关键规则，再留下可以回看的候选定义。
positioning_message: 通用执行型 Agent 擅长完成任务；数契聚焦把业务定义的证据、缺口、人的决定与本轮变化留在一起。
