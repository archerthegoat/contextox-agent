style_id: contextox-product-film-v4-a-measured-editorial
status: selected_direction_ready_for_production
visual_thesis: 用同一套精确取舍建立可信度，再让真实光标和产品状态承担动态；动作像人在操作，不像模板在表演
direction_evidence:
  selected_proof: output/video/contextox-demo-1.0.0-product-film-v4-hook-a.mp4
  reason_no_additional_styleframe: 12 秒运动样片已经同时验证构图、框线、真实 Workbench 和 A 曲剪辑呼吸，比静态风格帧提供更强证据
hierarchy:
  primary: 每镜只允许一个规则、一个问题或一个产品动作成为主角
  supporting: 解释标签、比较说明和披露保持清楚但不抢主动作
  progressive_reveal: 数据逐条取舍；产品沿发送、提问、确认、候选、变化连续推进
palette:
  navy: '#0D1B2E'
  paper: '#F4F1EA'
  surface: '#FFFFFF'
  ink: '#13243A'
  muted: '#667487'
  line: '#CCD5E0'
  blue: '#1674F3'
  blue_soft: '#EAF3FF'
  green: '#147D64'
  green_soft: '#EAF7F2'
  amber: '#A76A08'
  amber_soft: '#FFF2D4'
  red: '#B8493E'
  red_soft: '#FFE8E4'
typography:
  family: system_sans
  headline_px: 72
  result_px: 74
  caption_px: 54
  supporting_px: 30
  minimum_product_overlay_px: 28
  max_caption_lines: 2
motion_language:
  selected_shot_cards:
    - input-trigger-moves/cursor-performance
  inherited_approved_hook_method:
    - draw-svg-trace/exact_rect_trace
  allowed:
    - direct_hard_cut_on_120_bpm_accent
    - exact_rect_trace_from_declared_bounds_in_approved_hook_only
    - focus_mask_that_dims_non_target_content
    - cursor_move_to_real_control_coordinates
    - click_anchored_camera_punch_with_return
    - same_coordinate_screenshot_state_crossfade
    - content_clip_reveal_inside_existing_panel_bounds
  forbidden:
    - freehand_circle_or_underline
    - floating_connector_or_decorative_line
    - camera_shake_or_flash
    - decorative_glow_particle_or_three_dimensional_flip
    - random_card_pop_or_unmotivated_parallax
    - fake_product_control_or_fake_final_approval
  annotation_rule: 只有开场数据镜头使用连线；所有框线与连接继续由同一份声明式单元格坐标生成
  cursor_rule: 光标路径、点击点和局部推近原点必须共享同一份控件坐标；按钮按下、音效与镜头推近同帧
  effect_rule: 每个效果必须在 storyboard 的 cause 和 meaning 字段中说明对应产品动作与信息作用
  hold_rule: 问题和回答落定至少 30 帧；候选定义完整落定至少 45 帧；结尾 CTA 完整落定后停留 30 帧，最后 30 帧淡出至黑
  deterministic_rule: 不使用 Math.random、Date.now 或运行时 DOM 测量
audio_direction:
  music: Dirty Thinkin' by Michael Ramir C.
  bpm: 120
  beat_interval_frames: 15
  source_start_frames: 165
  source_start_seconds: 5.5
  cut_grid: 所有段落边界使用 15 帧整数倍
  energy_arc: 爵士放克底色保持稳定 -> 界面音效标记真实动作 -> 品牌收束后统一淡出
  music_volume_policy: 全片保持同一基准增益，不按镜头推高或压低；只在最后 60 帧平滑归零
  visual_fade_policy: 最后 30 帧由完整品牌画面淡出至黑
  sfx_vocabulary:
    - short_paper_slice_for_material_entry
    - marker_foley_only_while_geometry_is_drawn
    - original_dry_ui_click_on_real_control_press
    - original_confirm_tick_on_human_confirmation
    - original_short_result_open_on_candidate_update
  restraint: 强节奏 BGM 下只在真实交互触发点加音效；不叠 riser、音爆、游戏式点击包或无来源 impact
  loudness_target: 约 -16 LUFS，True Peak 不高于 -1 dBTP；最终 AAC 回读后再确认
  voice: none
safe_area_px:
  horizontal: 72
  vertical: 32
workbench_fidelity:
  screenshot_coordinate_space: 1684x947
  target_source: video/v4/workbench-layout.json
  screenshot_policy: 真实产品截图作为界面底图；程序化图层只重绘当前 Workbench 已存在的局部状态、文案层级和控件，不增加能力
  persistent_coordinate_rule: 15.5–37 秒始终保留完整 Workbench 与同一 1920x1080 坐标系；提问、回答、候选定义和本轮变化不得切成脱离产品的全屏概念卡
  answer_form_rule: 必须按当前产品顺序展示问题卡、快捷选择、回答、回答来源与依据、仅保存、尚未批准和确认并继续
  continuity_rule: 开场后的资料范围始终是 orders.csv、customers.csv、notes.md；不得混入旧两文件候选截图
comparison_boundary:
  compare_focus_not_capability: true
  handoff_sentence: 先把定义说清，再交给 Codex 或数据团队执行
inspiration_boundary:
  use: 强弱节奏反差、编辑式硬切、具有人手判断感的操作动作
  do_not_use: 复制任何创作者的具体构图、镜头、素材、音乐或签名式效果
